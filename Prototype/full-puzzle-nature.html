<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拍摄完整拼图 - 拼图碎片定位器</title>
    <link rel="stylesheet" href="css/nature-neumorphic.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--nature-light);
            font-family: var(--font-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .scan-container {
            text-align: center;
            padding: 20px 15px;
        }
        
        .instruction {
            text-align: center;
            margin: 20px 0 25px;
            font-size: 16px;
            color: var(--nature-dark);
            opacity: 0.9;
            padding: 0 15px;
        }
        
        .camera-button {
            margin: 40px auto;
            width: 80%;
            display: block;
            padding: 15px 0;
        }
        
        /* 拍摄区域样式 */
        .photo-area {
            width: 300px;
            height: 220px;
            margin: 0 auto 20px;
            background-color: var(--nature-light);
            border-radius: 16px;
            box-shadow: 
                inset 4px 4px 8px var(--nature-shadow-dark),
                inset -4px -4px 8px var(--nature-shadow-light);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .photo-area i {
            font-size: 40px;
            color: var(--nature-primary);
            margin-bottom: 10px;
            opacity: 0.7;
        }
        
        .photo-area p {
            margin: 5px 0;
            color: var(--nature-dark);
            font-size: 15px;
            opacity: 0.8;
        }
        
        /* 扫描区辅助元素 */
        .photo-area-helper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            height: 80%;
            border: 2px dashed var(--nature-primary);
            border-radius: 10px;
            opacity: 0.7;
            pointer-events: none;
        }
        
        .photo-area-helper::before,
        .photo-area-helper::after {
            content: '';
            position: absolute;
            background-color: var(--nature-primary);
            opacity: 0.5;
        }
        
        .photo-area-helper::before {
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            transform: translateY(-50%);
        }
        
        .photo-area-helper::after {
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
            transform: translateX(-50%);
        }
        
        .photo-note {
            margin-top: 20px;
            font-size: 14px;
            color: var(--nature-accent);
            font-style: italic;
            opacity: 0.8;
        }
        
        .scan-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            opacity: 0;
            z-index: 10;
            border-radius: 16px;
            pointer-events: none;
        }
        
        /* 预览和重拍按钮 */
        .preview-actions {
            display: none;
            margin-top: 20px;
            width: 100%;
            justify-content: space-between;
        }
        
        .preview-actions button {
            width: 48%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .retake-button {
            background-color: var(--nature-light);
            color: var(--nature-dark);
            box-shadow: 
                3px 3px 6px var(--nature-shadow-dark),
                -3px -3px 6px var(--nature-shadow-light);
        }
        
        .confirm-button {
            background-color: var(--nature-primary);
            color: white;
            box-shadow: 
                3px 3px 6px var(--nature-shadow-dark),
                -3px -3px 6px var(--nature-shadow-light);
        }
        
        .preview-actions button i {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <!-- iPhone 15框架 -->
    <div class="iphone-frame">
        <div class="screen">
            <!-- 灵动岛 -->
            <div class="dynamic-island"></div>
            
            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="status-left">
                    <span class="time">9:41</span>
                </div>
                <div class="status-right">
                    <i class="fas fa-signal"></i>
                    <i class="fas fa-wifi"></i>
                    <i class="fas fa-battery-full"></i>
                </div>
            </div>
            
            <!-- 主要内容 -->
            <div class="main-content">
                <a href="scan-nature.html" class="back-button">
                    <i class="fas fa-chevron-left"></i> 返回
                </a>
                
                <div class="scan-container">
                    <h1 class="page-title">拍摄完整拼图</h1>
                    
                    <div class="step-indicator">
                        <div class="step completed"></div>
                        <div class="step active"></div>
                        <div class="step"></div>
                    </div>
                    
                    <p class="instruction">请将完整拼图展开并拍照</p>
                    
                    <div class="photo-area">
                        <div class="photo-area-helper"></div>
                        <div class="scan-flash" id="scanFlash"></div>
                        <i class="fas fa-puzzle-piece"></i>
                        <p>将完整拼图展开在平面上</p>
                        <p class="photo-note">确保光线充足，图像清晰可见</p>
                    </div>
                    
                    <div class="preview-actions" id="previewActions">
                        <button class="retake-button">
                            <i class="fas fa-redo"></i> 重新拍摄
                        </button>
                        <button class="confirm-button">
                            <i class="fas fa-check"></i> 确认使用
                        </button>
                    </div>
                    
                    <button class="neumorphic-button camera-button" id="captureButton">
                        <i class="fas fa-camera"></i>
                        拍摄完整拼图
                    </button>
                </div>
                
                <div class="safe-area-bottom"></div>
            </div>
            
            <!-- 底部指示条 -->
            <div class="home-indicator"></div>
        </div>
    </div>
    
    <script src="js/nature-neumorphic.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 添加中心波纹效果到拼图区域
            const photoArea = document.querySelector('.photo-area');
            if (photoArea) {
                window.natureNeumorphic.addCenterRipple(photoArea);
            }
            
            // 拍照按钮点击事件
            const captureButton = document.getElementById('captureButton');
            const scanFlash = document.getElementById('scanFlash');
            const previewActions = document.getElementById('previewActions');
            
            if (captureButton && scanFlash && previewActions) {
                captureButton.addEventListener('click', function() {
                    // 闪光效果
                    scanFlash.style.transition = 'opacity 0.1s';
                    scanFlash.style.opacity = '1';
                    
                    setTimeout(() => {
                        scanFlash.style.opacity = '0';
                        
                        // 显示拍照成功通知
                        window.natureNeumorphic.simulateSystemNotification('拍照成功', '请确认图片清晰可用');
                        
                        // 显示预览和操作按钮
                        photoArea.style.backgroundImage = "url('images/puzzle_result.jpg')";
                        photoArea.style.backgroundSize = "cover";
                        photoArea.style.backgroundPosition = "center";
                        photoArea.querySelector('i').style.display = 'none';
                        photoArea.querySelectorAll('p').forEach(p => p.style.display = 'none');
                        
                        // 显示操作按钮
                        previewActions.style.display = 'flex';
                        captureButton.style.display = 'none';
                        
                        // 确认按钮点击事件
                        document.querySelector('.confirm-button').addEventListener('click', function() {
                            // 跳转到下一个页面
                            location.href = 'result-nature.html';
                        });
                        
                        // 重新拍摄按钮点击事件
                        document.querySelector('.retake-button').addEventListener('click', function() {
                            photoArea.style.backgroundImage = "none";
                            photoArea.querySelector('i').style.display = 'block';
                            photoArea.querySelectorAll('p').forEach(p => p.style.display = 'block');
                            
                            previewActions.style.display = 'none';
                            captureButton.style.display = 'block';
                        });
                    }, 200);
                });
            }
        });
    </script>
</body>
</html>
